name: PR Preview

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

env:
  APP_NAME: web

jobs:
  authorize-and-parse:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        startsWith(github.event.comment.body, '!deploy') ||
        startsWith(github.event.comment.body, '!teardown')
      )
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.parse.outputs.action }}
      fresh: ${{ steps.parse.outputs.fresh }}
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Parse command
        id: parse
        run: |
          BODY="$(printf '%s' "${{ github.event.comment.body }}" | tr -d '\r' | head -n1 | xargs)"
          if [[ "$BODY" == "!teardown" ]]; then
            echo "action=destroy" >> "$GITHUB_OUTPUT"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          elif [[ "$BODY" == "!deploy --fresh" ]]; then
            echo "action=deploy" >> "$GITHUB_OUTPUT"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif [[ "$BODY" == "!deploy" ]]; then
            echo "action=deploy" >> "$GITHUB_OUTPUT"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported command: $BODY"
            exit 1
          fi

      - name: Resolve PR head SHA
        id: pr
        if: steps.parse.outputs.action == 'deploy'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_sha', pr.data.head.sha);

  build-preview:
    needs: authorize-and-parse
    if: needs.authorize-and-parse.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize-and-parse.outputs.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies & build
        run: |
          pnpm install --frozen-lockfile
          if [[ -f .env.example ]]; then cp .env.example .env; fi
          pnpm run build

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ env.APP_NAME }}-pr-${{ needs.authorize-and-parse.outputs.pr_number }}
          path: |
            build/
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .npmrc
            tsconfig.json
            migrations/
            script/
          if-no-files-found: ignore
          retention-days: 1

  deploy-preview:
    needs: [authorize-and-parse, build-preview]
    if: needs.authorize-and-parse.outputs.action == 'deploy'
    runs-on: [self-hosted, preview]
    steps:
      - name: Download built bundle
        uses: actions/download-artifact@v4
        with:
          name: preview-${{ env.APP_NAME }}-pr-${{ needs.authorize-and-parse.outputs.pr_number }}
          path: ${{ runner.temp }}/preview-bundle

      - name: Deploy on Preview LXC
        id: deploy
        run: |
          EXTRA_ARGS=""
          if [[ "${{ needs.authorize-and-parse.outputs.fresh }}" == "true" ]]; then
            EXTRA_ARGS="--fresh"
          fi
          OUTPUT="$(sudo /usr/local/bin/preview-ctl deploy \
            "${{ env.APP_NAME }}" \
            "${{ needs.authorize-and-parse.outputs.pr_number }}" \
            "${{ runner.temp }}/preview-bundle" \
            $EXTRA_ARGS)"
          echo "$OUTPUT"
          PREVIEW_URL="$(printf '%s\n' "$OUTPUT" | awk -F= '/^PREVIEW_URL=/{print $2}')"
          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = '${{ needs.authorize-and-parse.outputs.head_sha }}'.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Preview deployed** for commit \`${sha}\`:\n\n${url}`
            });

  teardown-comment:
    needs: authorize-and-parse
    if: needs.authorize-and-parse.outputs.action == 'destroy'
    runs-on: [self-hosted, preview]
    steps:
      - name: Destroy preview
        run: |
          sudo /usr/local/bin/preview-ctl destroy \
            "${{ env.APP_NAME }}" \
            "${{ needs.authorize-and-parse.outputs.pr_number }}"

      - name: Confirm teardown on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🧹 **Preview environment torn down.**'
            });

  teardown-on-close:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: [self-hosted, preview]
    steps:
      - name: Destroy preview on PR close
        run: |
          sudo /usr/local/bin/preview-ctl destroy \
            "${{ env.APP_NAME }}" \
            "${{ github.event.pull_request.number }}"
